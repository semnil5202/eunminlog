# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "eunminlog"

[setup]
script = '''
#!/usr/bin/env bash

set -Eeuo pipefail

SOURCE_WORKTREE_PATH="${SOURCE_WORKTREE_PATH:-/Users/semnil5202/Documents/vscode/eunminlog}"
export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"

echo "[eunminlog] setup started"

if [ ! -f "package.json" ] || [ ! -f "pnpm-lock.yaml" ]; then
  echo "[eunminlog] ✖ repository root에서 실행해야 합니다"
  exit 1
fi

if command -v fnm >/dev/null 2>&1; then
  eval "$(fnm env --shell bash)"
  fnm use --install-if-missing
elif [ -s "$NVM_DIR/nvm.sh" ]; then
  . "$NVM_DIR/nvm.sh"
  nvm install
  nvm use
else
  echo "[eunminlog] ✖ neither fnm nor nvm is available"
  exit 1
fi

current_node_major_version="$(node -p "process.versions.node.split('.')[0]")"

if [ "$current_node_major_version" -lt 24 ]; then
  echo "[eunminlog] ✖ Node.js 24 이상이 필요합니다"
  exit 1
fi

if ! command -v corepack >/dev/null 2>&1; then
  echo "[eunminlog] ✖ corepack is not available"
  exit 1
fi

corepack enable
corepack prepare pnpm@10.6.2 --activate

echo "[eunminlog] installing dependencies"
pnpm install --frozen-lockfile

required_local_files=(
  "apps/client/.env"
  "apps/client/local.pem"
  "apps/client/local-key.pem"
  "apps/admin/.env"
  "apps/admin/local.pem"
  "apps/admin/local-key.pem"
)

missing_required_files=false

for required_relative_path in "${required_local_files[@]}"; do
  target_required_file="$PWD/$required_relative_path"
  source_required_file="$SOURCE_WORKTREE_PATH/$required_relative_path"

  if [ -f "$target_required_file" ]; then
    echo "[eunminlog] ✔ $required_relative_path already exists"
    continue
  fi

  if [ -f "$source_required_file" ]; then
    target_parent_directory="$(dirname "$target_required_file")"
    mkdir -p "$target_parent_directory"
    cp -p "$source_required_file" "$target_required_file"
    echo "[eunminlog] ✔ $required_relative_path copied from source checkout"
    continue
  fi

  missing_required_files=true
  echo "[eunminlog] ⚠ $required_relative_path was not found"
done

if [ "$missing_required_files" = true ]; then
  echo "[eunminlog] ⚠ 일부 환경파일 또는 HTTPS 인증서가 없습니다"
  echo "[eunminlog] ⚠ 코드 작업은 가능하지만 dev/build 실행은 실패할 수 있습니다"
fi

echo "[eunminlog] ✔ setup completed"'''
